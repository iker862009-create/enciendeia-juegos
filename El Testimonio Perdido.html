<!DOCTYPE html>

<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Testimonio Perdido</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(180deg, #2b3a55 0%, #1B3A5C 55%, #0d1e33 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 16px; color: #fff; position: relative;
  }
  h1 { text-align: center; font-size: 1.5em; text-shadow: 2px 2px 0 #0d1e33; margin: 6px 0; }
  .sub { text-align: center; opacity: 0.95; margin-bottom: 14px; max-width: 460px; }
  .stats { display: flex; gap: 20px; margin-bottom: 14px; font-weight: bold; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 460px; width: 100%; }
  .card { aspect-ratio: 1; border-radius: 14px; cursor: pointer; perspective: 600px; }
  .card-inner { width: 100%; height: 100%; transition: transform 0.4s; transform-style: preserve-3d; position: relative; }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face { position: absolute; width: 100%; height: 100%; border-radius: 14px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; padding: 4px; text-align: center; font-size: 0.72em; font-weight: bold; }
  .back { background: #FFB300; color: #1B3A5C; font-size: 1.8em; }
  .front { background: white; color: #1B3A5C; transform: rotateY(180deg); line-height: 1.2; }
  .card.matched .front { background: #d7f7de; }
  .end-screen { display: none; text-align: center; margin-top: 20px; }
  .restart { margin-top: 14px; padding: 14px 28px; background: #4CBB6F; color: white; border: none; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #327d49; }
  .mute-btn { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 46px; height: 46px; font-size: 1.3em; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,21,36,0.94); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-box { background: white; color: #1B3A5C; border-radius: 24px; padding: 30px; max-width: 420px; text-align: center; }
  .modal-box button { margin-top: 16px; padding: 16px 32px; background: #4CBB6F; color: white; border: none; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #327d49; }
  .hidden { display: none; }
</style>
</head>
<body>
<button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
<div class="modal-overlay" id="introModal">
  <div class="modal-box">
    <div style="font-size:3em">📡</div>
    <h2>Cómo se juega</h2>
    <p>Voltea dos tarjetas a la vez. Encuentra qué objeto del pasado va con su uso.</p>
    <button onclick="closeIntro()">¡Empezar misión! 🎮</button>
  </div>
</div>
<h1>📡 El Testimonio Perdido</h1>
<p class="sub">La Agente Luna recolectó objetos de otras épocas. Encuentra qué objeto va con su uso.</p>
<div class="stats"><span>Intentos: <span id="moves">0</span></span><span>Parejas: <span id="matches">0</span>/6</span></div>
<div class="board hidden" id="board"></div>

<div class="end-screen" id="endScreen">
  <div style="font-size:3.5em">📡🏆</div>
  <h2>¡Testimonio recuperado!</h2>
  <p id="movesText"></p>
  <button class="restart" onclick="init()">Jugar de nuevo</button>
</div>

<script>
let muted = false;
function vibrate(pattern) { if (!muted && navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e){} } }
function toggleMute() { muted = !muted; document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊'; }
function confettiBurst() {
  const colors = ['#FFB300','#FF6F61','#4CBB6F','#9575CD','#ffffff'];
  for (let i=0;i<40;i++){
    const el = document.createElement('div');
    const size = 6+Math.random()*8;
    el.style.cssText = `position:fixed;top:-20px;left:${Math.random()*100}vw;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};z-index:9999;pointer-events:none;`;
    document.body.appendChild(el);
    const duration = 2200+Math.random()*1500;
    const rotate = (Math.random()>0.5?1:-1)*(Math.random()*360+180);
    const drift = (Math.random()-0.5)*200;
    el.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${drift}px, 100vh) rotate(${rotate}deg)`,opacity:0.4}],{duration,easing:'ease-in'});
    setTimeout(()=>el.remove(), duration);
  }
}
function closeIntro() { document.getElementById('introModal').style.display = 'none'; document.getElementById('board').classList.remove('hidden'); init(); }

const pairs = [
  { id: 1, a: "📻 Radio antiguo", b: "Escuchar noticias antes de internet" },
  { id: 2, a: "✉️ Carta en papel", b: "Comunicarse antes del celular" },
  { id: 3, a: "🕯️ Lámpara de aceite", b: "Alumbrar antes de la luz eléctrica" },
  { id: 4, a: "🐴 Caballo", b: "Transportarse antes del carro" },
  { id: 5, a: "🧵 Costura a mano", b: "Hacer ropa antes de las máquinas" },
  { id: 6, a: "📷 Cámara de rollo", b: "Tomar fotos antes de las digitales" },
];

let cards = [], flipped = [], matchesFound = 0, moves = 0, lock = false;

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function init() {
  matchesFound = 0; moves = 0; flipped = []; lock = false;
  document.getElementById('moves').textContent = 0;
  document.getElementById('matches').textContent = 0;
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('board').style.display = 'grid';
  let deck = [];
  pairs.forEach(p => { deck.push({ id: p.id, text: p.a }); deck.push({ id: p.id, text: p.b }); });
  deck = shuffle(deck);
  const board = document.getElementById('board');
  board.innerHTML = '';
  cards = deck.map((d, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="card-inner"><div class="face back">🗂️</div><div class="face front">${d.text}</div></div>`;
    card.onclick = () => flip(i);
    board.appendChild(card);
    return { el: card, id: d.id, matched: false };
  });
}

function flip(i) {
  if (lock || cards[i].matched || flipped.includes(i)) return;
  cards[i].el.classList.add('flipped');
  flipped.push(i);
  if (flipped.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    lock = true;
    const [a, b] = flipped;
    if (cards[a].id === cards[b].id) {
      cards[a].matched = true; cards[b].matched = true;
      cards[a].el.classList.add('matched'); cards[b].el.classList.add('matched');
      matchesFound++;
      vibrate(40);
      document.getElementById('matches').textContent = matchesFound;
      flipped = []; lock = false;
      if (matchesFound === pairs.length) setTimeout(endGame, 500);
    } else {
      vibrate([30,60,30]);
      setTimeout(() => {
        cards[a].el.classList.remove('flipped');
        cards[b].el.classList.remove('flipped');
        flipped = []; lock = false;
      }, 900);
    }
  }
}

function endGame() {
  document.getElementById('board').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
  document.getElementById('movesText').textContent = 'Lo lograste en ' + moves + ' intentos.';
  confettiBurst();
}
</script>


</body></html>
