<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Tesoro de la Memoria</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(180deg, #8fe3f0 0%, #2a9fc0 55%, #0d5c73 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 16px; color: #fff;
  }
  h1 { text-align: center; font-size: 1.5em; text-shadow: 2px 2px 0 #0d5c73; margin: 6px 0; }
  .sub { text-align: center; opacity: 0.95; margin-bottom: 14px; max-width: 460px; }
  .stats { display: flex; gap: 20px; margin-bottom: 14px; font-weight: bold; }
  .board {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 460px; width: 100%;
  }
  .card { aspect-ratio: 1; border-radius: 14px; cursor: pointer; perspective: 600px; }
  .card-inner { width: 100%; height: 100%; transition: transform 0.4s; transform-style: preserve-3d; position: relative; }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; width: 100%; height: 100%; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; backface-visibility: hidden;
    padding: 4px; text-align: center; font-size: 0.75em; font-weight: bold;
  }
  .back { background: #FF6F61; color: white; font-size: 1.8em; }
  .front { background: white; color: #0d5c73; transform: rotateY(180deg); line-height: 1.2; }
  .card.matched .front { background: #d7f7de; }
  .end-screen { display: none; text-align: center; margin-top: 20px; }
  .restart {
    margin-top: 14px; padding: 14px 28px; background: #4CBB6F; color: white;
    border: none; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer;
    box-shadow: 0 6px 0 #327d49;
  }
</style>
</head>
<body>
<h1>🦀 El Tesoro de la Memoria</h1>
<p class="sub">Coco guardó recuerdos de "antes" y de "ahora". Encuentra qué cosa de antes es la misma que una de ahora.</p>
<div class="stats"><span>Intentos: <span id="moves">0</span></span><span>Parejas: <span id="matches">0</span>/6</span></div>
<div class="board" id="board"></div>

<div class="end-screen" id="endScreen">
  <div style="font-size:3.5em">🦀🏆</div>
  <h2>¡Encontraste el tesoro de la memoria!</h2>
  <p id="movesText"></p>
  <button class="restart" onclick="init()">Jugar de nuevo</button>
</div>

<script>
const pairs = [
  { id: 1, a: "🕯️ Antes: lámpara de aceite", b: "💡 Ahora: foco eléctrico" },
  { id: 2, a: "✉️ Antes: carta en papel", b: "📱 Ahora: mensaje de celular" },
  { id: 3, a: "🐴 Antes: viajar a caballo", b: "🚗 Ahora: viajar en carro" },
  { id: 4, a: "📻 Antes: noticias por radio", b: "📺 Ahora: noticias por internet" },
  { id: 5, a: "🧺 Antes: lavar ropa a mano", b: "🧺 Ahora: lavadora" },
  { id: 6, a: "🪵 Antes: juguetes hechos a mano", b: "🧸 Ahora: juguetes de tienda" },
];

let cards = [], flipped = [], matchesFound = 0, moves = 0, lock = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  matchesFound = 0; moves = 0; flipped = []; lock = false;
  document.getElementById('moves').textContent = 0;
  document.getElementById('matches').textContent = 0;
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('board').style.display = 'grid';

  let deck = [];
  pairs.forEach(p => { deck.push({ id: p.id, text: p.a }); deck.push({ id: p.id, text: p.b }); });
  deck = shuffle(deck);

  const board = document.getElementById('board');
  board.innerHTML = '';
  cards = deck.map((d, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="card-inner"><div class="face back">🦪</div><div class="face front">${d.text}</div></div>`;
    card.onclick = () => flip(i);
    board.appendChild(card);
    return { el: card, id: d.id, matched: false };
  });
}

function flip(i) {
  if (lock || cards[i].matched || flipped.includes(i)) return;
  cards[i].el.classList.add('flipped');
  flipped.push(i);
  if (flipped.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    lock = true;
    const [a, b] = flipped;
    if (cards[a].id === cards[b].id) {
      cards[a].matched = true; cards[b].matched = true;
      cards[a].el.classList.add('matched'); cards[b].el.classList.add('matched');
      matchesFound++;
      document.getElementById('matches').textContent = matchesFound;
      flipped = []; lock = false;
      if (matchesFound === pairs.length) setTimeout(endGame, 500);
    } else {
      setTimeout(() => {
        cards[a].el.classList.remove('flipped');
        cards[b].el.classList.remove('flipped');
        flipped = []; lock = false;
      }, 900);
    }
  }
}

function endGame() {
  document.getElementById('board').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
  document.getElementById('movesText').textContent = 'Lo lograste en ' + moves + ' intentos.';
}

init();
</script>
</body>
</html>
