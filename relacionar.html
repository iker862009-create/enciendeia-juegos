<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relaciona la fecha — Efemérides de Septiembre | EnciendeIA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap');

  :root{
    --navy:#1C3A52;
    --teal:#0E6B85;
    --gold:#C98A1F;
    --cream:#FDF6EC;
    --green:#3F9B5C;
    --red:#C0392B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 90% 10%, #ffe9c7 0%, transparent 35%),
      radial-gradient(circle at 5% 90%, #d6ecef 0%, transparent 40%),
      var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--navy);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  .brand{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:1.1rem;
    color:var(--gold);
    text-align:center;
  }
  h1{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:clamp(1.5rem, 4vw, 2.2rem);
    margin:4px 0 2px;
    text-align:center;
  }
  .sub{
    font-size:1rem;
    color:var(--teal);
    font-weight:600;
    margin-bottom:24px;
    text-align:center;
  }

  .game{
    display:flex;
    gap:40px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:900px;
    width:100%;
  }
  .col{
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
  }
  .col-title{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    color:var(--navy);
    margin-bottom:4px;
  }

  .tile{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    background:#fff;
    border:3px solid transparent;
    border-radius:16px;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(28,58,82,0.15);
    transition:transform .15s ease, box-shadow .15s ease;
    user-select:none;
  }
  .tile:hover{ transform:translateY(-2px); }
  .tile:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(28,58,82,0.15); }

  .date-tile{
    width:170px;
    padding:16px 10px;
    text-align:center;
    font-size:1.1rem;
    color:var(--navy);
  }
  .img-tile{
    width:130px;
    height:130px;
    padding:6px;
    overflow:hidden;
  }
  .img-tile img{
    width:100%; height:100%; object-fit:cover; border-radius:10px; display:block;
  }

  .tile.selected{ border-color:var(--gold); box-shadow:0 4px 0 var(--gold); }
  .tile.correct{ border-color:var(--green); background:#eafaf0; cursor:default; }
  .tile.correct:hover{ transform:none; }
  .tile.wrong{ border-color:var(--red); animation:shake .35s; }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .win-banner{
    display:none;
    margin-top:30px;
    text-align:center;
    background:#fff;
    border-radius:20px;
    padding:20px 30px;
    box-shadow:0 6px 0 rgba(28,58,82,0.15);
    font-family:'Fredoka', sans-serif;
  }
  .win-banner.show{ display:block; animation:pop .4s ease; }
  @keyframes pop{ from{transform:scale(.8); opacity:0;} to{transform:scale(1); opacity:1;} }
  .win-banner h2{ color:var(--gold); margin:0 0 6px; font-size:1.6rem; }
  .win-banner p{ margin:0 0 14px; font-weight:600; }
  button.restart{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:10px 22px;
    font-size:1rem;
    cursor:pointer;
    box-shadow:0 3px 0 #084a5c;
  }
  button.restart:active{ transform:translateY(2px); box-shadow:none; }

  footer{
    margin-top:40px;
    font-size:0.8rem;
    color:#8a94a0;
    text-align:center;
  }
</style>
</head>
<body>

<div class="brand">🔥 EnciendeIA</div>
<h1>¿Qué pasó esta fecha?</h1>
<div class="sub">1er grado · Toca una fecha y luego su imagen</div>

<div class="game">
  <div class="col">
    <div class="col-title">Fechas</div>
    <div id="dates"></div>
  </div>
  <div class="col">
    <div class="col-title">Imágenes</div>
    <div id="images"></div>
  </div>
</div>

<div class="win-banner" id="winBanner">
  <h2>¡Muy bien! 🎉</h2>
  <p id="winText">Relacionaste las 5 fechas correctamente.</p>
  <button class="restart" onclick="startGame()">Jugar de nuevo</button>
</div>

<footer>EnciendeIA — Materiales que Transforman</footer>

<script>
const ITEMS = [
  { id: 'a', date: '8 de septiembre', src: 'assets/08sep_color.jpg' },
  { id: 'b', date: '13 de septiembre', src: 'assets/13sep_color.jpg' },
  { id: 'c', date: '15-16 de septiembre', src: 'assets/1516sep_color.jpg' },
  { id: 'd', date: '19 de septiembre', src: 'assets/19sep_color.jpg' },
  { id: 'e', date: '21 de septiembre', src: 'assets/21sep_paloma_color.jpg' },
];

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

let selectedDate = null;
let matchedCount = 0;

function startGame(){
  matchedCount = 0;
  selectedDate = null;
  document.getElementById('winBanner').classList.remove('show');

  const datesEl = document.getElementById('dates');
  const imagesEl = document.getElementById('images');
  datesEl.innerHTML = '';
  imagesEl.innerHTML = '';

  const shuffledDates = shuffle([...ITEMS]);
  const shuffledImages = shuffle([...ITEMS]);

  shuffledDates.forEach(item=>{
    const el = document.createElement('div');
    el.className = 'tile date-tile';
    el.textContent = item.date;
    el.dataset.id = item.id;
    el.addEventListener('click', ()=>selectDate(el, item.id));
    datesEl.appendChild(el);
  });

  shuffledImages.forEach(item=>{
    const el = document.createElement('div');
    el.className = 'tile img-tile';
    el.dataset.id = item.id;
    el.innerHTML = `<img src="${item.src}" alt="${item.date}">`;
    el.addEventListener('click', ()=>selectImage(el, item.id));
    imagesEl.appendChild(el);
  });
}

function selectDate(el, id){
  if(el.classList.contains('correct')) return;
  document.querySelectorAll('.date-tile').forEach(t=>t.classList.remove('selected'));
  el.classList.add('selected');
  selectedDate = { el, id };
}

function selectImage(el, id){
  if(el.classList.contains('correct') || !selectedDate) return;

  if(selectedDate.id === id){
    selectedDate.el.classList.remove('selected');
    selectedDate.el.classList.add('correct');
    el.classList.add('correct');
    matchedCount++;
    selectedDate = null;
    if(matchedCount === ITEMS.length){
      setTimeout(()=>{
        document.getElementById('winBanner').classList.add('show');
      }, 300);
    }
  } else {
    el.classList.add('wrong');
    selectedDate.el.classList.add('wrong');
    setTimeout(()=>{
      el.classList.remove('wrong');
      selectedDate.el.classList.remove('wrong');
    }, 350);
  }
}

startGame();
</script>
</body>
</html>
