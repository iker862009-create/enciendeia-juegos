<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Plato Saludable — 1er Grado</title>
<style>
  :root { --teal:#0096BC; --teal-dark:#006583; --navy:#1B3A5C; --gold:#FFB300; --coral:#FF6F61; --green:#4CBB6F; --purple:#9575CD; --cream:#FFFAEB; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(180deg,var(--teal) 0%,var(--teal-dark) 100%); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; color:var(--navy); }
  .bunting { display:flex; width:100%; max-width:700px; height:24px; margin-bottom:10px; }
  .bunting div { flex:1; height:0; border-left:20px solid transparent; border-right:20px solid transparent; border-top:24px solid; }
  h1 { color:white; font-size:1.7rem; margin:10px 0 4px; text-align:center; }
  .sub { color:#FFE7B0; margin-bottom:16px; font-weight:600; }
  .card { background:white; border-radius:24px; padding:24px; max-width:700px; width:100%; box-shadow:0 8px 24px rgba(0,0,0,0.15); text-align:center; }
  .plate {
    width:220px; height:220px; border-radius:50%; border:8px dashed var(--teal); margin:0 auto 20px;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px; padding:10px; background:var(--cream);
    font-size:1.8rem;
  }
  .foods { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:10px; }
  .food { border:3px solid var(--teal); border-radius:14px; padding:10px; font-size:2rem; background:white; cursor:pointer; transition:transform 0.15s; position:relative; }
  .food:active { transform:scale(0.92); }
  .food.used { opacity:0.3; pointer-events:none; }
  .label { font-size:0.7rem; margin-top:2px; color:var(--navy); }
  .feedback { text-align:center; font-size:1.2rem; font-weight:700; margin-top:16px; min-height:36px; }
  .next-btn { display:block; margin:16px auto 0; background:var(--gold); color:white; border:none; border-radius:30px; padding:14px 32px; font-size:1.1rem; font-weight:700; cursor:pointer; }
  .stars { font-size:2.5rem; text-align:center; margin:16px 0; }
  .progress { color:white; margin-top:14px; font-weight:600; }
  footer { color:#D6EEF5; margin-top:20px; font-size:0.85rem; text-align:center; }
</style>
</head>
<body>
  <div class="bunting" id="bunting"></div>
  <h1>🐒 El Plato Saludable 🦓</h1>
  <div class="sub">1er Grado · Proyecto 5</div>
  <div class="card">
    <p style="font-weight:600;">Toca 4 alimentos saludables para armar tu plato:</p>
    <div class="plate" id="plate"></div>
    <div class="foods" id="foods"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="progress" id="progress">Elegidos: 0 de 4</div>
  <footer>EnciendeIA · Planeaciones NEM</footer>

<script>
const colors = ['#FF6F61','#FFB300','#4CBB6F','#0096BC','#9575CD'];
const b = document.getElementById('bunting');
for (let i=0;i<15;i++){ const d=document.createElement('div'); d.style.borderTopColor=colors[i%5]; b.appendChild(d); }

const allFoods = [
  {emoji:"🍎",label:"Manzana",healthy:true},
  {emoji:"🥦",label:"Brócoli",healthy:true},
  {emoji:"🍞",label:"Pan",healthy:true},
  {emoji:"🍗",label:"Pollo",healthy:true},
  {emoji:"🥕",label:"Zanahoria",healthy:true},
  {emoji:"🍌",label:"Plátano",healthy:true},
  {emoji:"🍰",label:"Pastel",healthy:false},
  {emoji:"🥤",label:"Refresco",healthy:false},
  {emoji:"🍬",label:"Dulces",healthy:false},
  {emoji:"🍟",label:"Papas fritas",healthy:false},
];

let chosen = 0;
let wrongClicks = 0;
const foodsShuffled = allFoods.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);

function renderFoods() {
  document.getElementById('foods').innerHTML = foodsShuffled.map((f,i) => `
    <div class="food" id="food${i}" onclick="pickFood(${i})">
      ${f.emoji}
      <div class="label">${f.label}</div>
    </div>
  `).join('');
}

function pickFood(i) {
  const f = foodsShuffled[i];
  const el = document.getElementById('food'+i);
  if (el.classList.contains('used')) return;
  if (f.healthy) {
    el.classList.add('used');
    document.getElementById('plate').innerHTML += f.emoji;
    chosen++;
    document.getElementById('progress').textContent = `Elegidos: ${chosen} de 4`;
    document.getElementById('feedback').textContent = "¡Buena elección! 🎉";
    if (chosen === 4) finish();
  } else {
    document.getElementById('feedback').textContent = "Ese lo comemos solo a veces 🙂 ¡intenta con otro!";
    wrongClicks++;
  }
}

function finish() {
  setTimeout(() => {
    document.querySelector('.card').innerHTML = `
      <div class="stars">⭐⭐⭐⭐⭐</div>
      <div class="feedback">¡Armaste tu plato saludable! 🥗</div>
      <button class="next-btn" onclick="location.reload()">Jugar de nuevo</button>
    `;
    document.getElementById('progress').textContent = '';
  }, 800);
}

renderFoods();
</script>
</body>
</html>
