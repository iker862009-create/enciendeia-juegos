<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>El Doctor de Plantas — EnciendeIA</title>
<style>
  body { font-family: Arial, sans-serif; background: linear-gradient(180deg,#e8f8f0,#c9f2dd); color: #1a1a1a; margin:0; padding:20px; text-align:center; }
  h1 { color: #00885a; }
  .scene { background: #ffffff; border: 3px solid #00B4D8; border-radius: 16px; padding: 20px; max-width: 480px; margin: 20px auto; }
  .planta { font-size: 90px; line-height: 1; }
  .desc { font-size: 18px; margin-top: 10px; }
  button.opt { display:block; width:80%; margin:10px auto; padding:14px; font-size:18px; border:none; border-radius:10px; background:#00B4D8; color:white; cursor:pointer; }
  button.opt:hover { background:#0093b0; }
  button.opt:disabled { opacity: 0.6; cursor: default; }
  #feedback { font-size:20px; min-height:50px; margin-top:10px; font-weight:bold; max-width:480px; margin-left:auto; margin-right:auto; }
  #score { font-size:16px; color:#F4A100; font-weight:bold; }
  #next { padding:10px 20px; font-size:16px; background:#F4A100; border:none; border-radius:8px; cursor:pointer; display:none; color:white; }
  #final { display:none; background:#ffffff; border: 3px solid #00B4D8; border-radius:16px; padding:30px; max-width:480px; margin:20px auto; }
  #final h2 { color:#00885a; margin-top:0; }
  #final p { font-size:16px; line-height:1.5; }
  #playAgain { padding:12px 24px; font-size:16px; background:#00B4D8; color:white; border:none; border-radius:10px; cursor:pointer; margin-top:10px; }
  #playAgain:hover { background:#0093b0; }
</style>
</head>
<body>
<h1>🌱 El Doctor de Plantas</h1>
<p>Mira a la plantita. ¿Qué le hace falta para estar sana?</p>
<div class="scene" id="scene"></div>
<div id="options"></div>
<div id="feedback"></div>
<div id="score">Aciertos: 0 / 0</div>
<button id="next" onclick="nextRound()">Siguiente →</button>

<div id="final">
  <h2>🌻 ¡Turno completado!</h2>
  <p id="finalScore"></p>
  <p>Ya lo sabes: una planta necesita tierra, agua, luz, aire y mucho cuidado para crecer sana.</p>
  <button id="playAgain" onclick="restart()">Jugar de nuevo</button>
</div>

<script>
const rounds = [
  { emoji: "🥀", desc: "Esta plantita está triste y sus hojas cuelgan hacia abajo. Hace mucho calor y su tierra se ve seca y agrietada.",
    correct: "Agua",
    explain: "¡Correcto! Cuando la tierra se ve seca y agrietada, la planta necesita agua." },
  { emoji: "🌱", desc: "Esta plantita está en una caja cerrada, dentro de un clóset oscuro, sin ninguna ventana cerca.",
    correct: "Luz",
    explain: "¡Correcto! Sin luz del sol, la planta no puede crecer fuerte ni verde." },
  { emoji: "🌿", desc: "Esta plantita está en una maceta con la tierra bien mojadita y mucho sol, pero está encerrada dentro de una bolsa de plástico bien cerrada.",
    correct: "Aire",
    explain: "¡Correcto! Aunque tenga agua y luz, sin aire moviéndose a su alrededor, la planta tampoco puede respirar bien." },
  { emoji: "🌾", desc: "Esta plantita está creciendo directamente sobre una piedra lisa, sin nada alrededor de sus raíces.",
    correct: "Tierra",
    explain: "¡Correcto! Las raíces necesitan tierra para sostenerse y tomar sus alimentos." },
  { emoji: "🌻", desc: "Esta plantita tiene tierra húmeda, recibe sol por la ventana, y el aire se mueve libremente a su alrededor.",
    correct: "Ya está sana",
    explain: "¡Correcto! Esta plantita ya tiene todo lo que necesita: tierra, agua, luz y aire." },
  { emoji: "🥀", desc: "Nadie ha regado esta plantita en muchos días y sus hojas empiezan a ponerse amarillas y caídas.",
    correct: "Agua",
    explain: "¡Correcto! Las hojas amarillas y caídas casi siempre son señal de que le falta agua." }
];

let order = [...rounds].sort(() => Math.random() - 0.5);
let idx = 0, correct = 0, total = 0;
const options = ["Tierra", "Agua", "Luz", "Aire", "Ya está sana"];

function render() {
  const r = order[idx];
  document.getElementById("next").textContent = (idx === order.length - 1) ? "Ver resultado →" : "Siguiente →";
  document.getElementById("scene").innerHTML = `<div class="planta">${r.emoji}</div><div class="desc">${r.desc}</div>`;
  const opts = document.getElementById("options");
  opts.innerHTML = "";
  options.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o;
    b.onclick = () => check(o, r);
    opts.appendChild(b);
  });
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").style.display = "none";
}

function check(choice, r) {
  total++;
  const fb = document.getElementById("feedback");
  if (choice === r.correct) {
    correct++;
    fb.style.color = "#16a34a";
    fb.textContent = r.explain;
  } else {
    fb.style.color = "#dc2626";
    fb.textContent = "No exactamente. " + r.explain;
  }
  document.getElementById("score").textContent = `Aciertos: ${correct} / ${total}`;
  document.querySelectorAll("button.opt").forEach(b => b.disabled = true);
  document.getElementById("next").style.display = "inline-block";
}

function nextRound() {
  if (idx < order.length - 1) {
    idx++;
    render();
  } else {
    showFinal();
  }
}

function showFinal() {
  document.querySelector(".scene").style.display = "none";
  document.getElementById("options").style.display = "none";
  document.getElementById("feedback").style.display = "none";
  document.getElementById("score").style.display = "none";
  document.getElementById("next").style.display = "none";
  document.getElementById("finalScore").textContent = `Respondiste correctamente ${correct} de ${total} rondas.`;
  document.getElementById("final").style.display = "block";
}

function restart() {
  order = [...rounds].sort(() => Math.random() - 0.5);
  idx = 0; correct = 0; total = 0;
  document.getElementById("final").style.display = "none";
  document.querySelector(".scene").style.display = "block";
  document.getElementById("options").style.display = "block";
  document.getElementById("feedback").style.display = "block";
  document.getElementById("score").style.display = "block";
  document.getElementById("score").textContent = "Aciertos: 0 / 0";
  render();
}

render();
</script>
</body>
</html>
