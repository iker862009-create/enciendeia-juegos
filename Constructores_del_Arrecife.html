<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructores del Arrecife</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(180deg, #7fd8e8 0%, #1a8fb0 60%, #0d5c73 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 20px; color: #fff;
  }
  h1 { text-align: center; font-size: 1.6em; text-shadow: 2px 2px 0 #0d5c73; margin: 10px 0; }
  .sub { text-align: center; opacity: 0.9; margin-bottom: 10px; }
  .progress { display: flex; gap: 6px; margin-bottom: 20px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .dot.done { background: #FFB300; }
  .card {
    background: white; color: #0d5c73; border-radius: 24px; padding: 30px 24px;
    max-width: 420px; width: 100%; text-align: center; font-size: 1.3em; font-weight: bold;
    box-shadow: 0 8px 0 #0a4a5c; margin-bottom: 24px; min-height: 100px;
    display: flex; align-items: center; justify-content: center;
  }
  .buttons { display: flex; gap: 16px; width: 100%; max-width: 420px; }
  button.choice {
    flex: 1; padding: 20px 10px; border: none; border-radius: 18px; font-size: 1.1em;
    font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,0.2); color: white;
  }
  .yes { background: #4CBB6F; }
  .no { background: #FF6F61; }
  button.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .feedback { font-size: 1.4em; margin-top: 16px; min-height: 40px; text-align: center; }
  .end-screen { display: none; text-align: center; }
  .end-screen h2 { font-size: 2em; }
  .turtle { font-size: 4em; }
  .restart {
    margin-top: 20px; padding: 14px 28px; background: #FFB300; color: #0d5c73;
    border: none; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer;
    box-shadow: 0 6px 0 #b57900;
  }
</style>
</head>
<body>
<h1>🐢 Constructores del Arrecife</h1>
<p class="sub">Tortu necesita tu ayuda: ¿esto ayuda a la convivencia del arrecife, o no ayuda?</p>
<div class="progress" id="progress"></div>

<div id="game">
  <div class="card" id="cardText">Cargando...</div>
  <div class="buttons">
    <button class="choice yes" onclick="answer(true)">✅ Sí ayuda</button>
    <button class="choice no" onclick="answer(false)">❌ No ayuda</button>
  </div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="end-screen" id="endScreen">
  <div class="turtle">🐢🏆</div>
  <h2>¡Reglamento completo!</h2>
  <p id="scoreText"></p>
  <p>Acertaste <span id="finalScore"></span> de <span id="finalTotal"></span></p>
  <button class="restart" onclick="restart()">Jugar de nuevo</button>
</div>

<script>
const items = [
  { text: "Escuchar a mi compañero antes de responder", correct: true },
  { text: "Empujar para pasar primero", correct: false },
  { text: "Proponer una regla pensando en todos, no solo en mí", correct: true },
  { text: "Burlarme de alguien si se equivoca", correct: false },
  { text: "Levantar la mano para pedir mi turno de hablar", correct: true },
  { text: "Tomar el material de otro sin pedirlo", correct: false },
  { text: "Ayudar a un compañero que no entendió la actividad", correct: true },
  { text: "Gritar cuando algo no me gusta", correct: false },
];

let order = [];
let current = 0;
let score = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  items.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot' + i;
    p.appendChild(d);
  });
}

function showCard() {
  if (current >= order.length) return endGame();
  document.getElementById('cardText').textContent = order[current].text;
  document.getElementById('feedback').textContent = '';
}

function answer(choice) {
  const correct = order[current].correct === choice;
  const fb = document.getElementById('feedback');
  if (correct) {
    score++;
    fb.textContent = '¡Correcto! 🎉';
    fb.style.color = '#FFB300';
  } else {
    fb.textContent = order[current].correct ? 'Mmm, esto sí ayuda a convivir 🤔' : 'Mmm, esto no ayuda a convivir 🤔';
    fb.style.color = '#ffdada';
  }
  document.getElementById('dot' + current).classList.add('done');
  current++;
  setTimeout(showCard, 1100);
}

function endGame() {
  document.getElementById('game').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalTotal').textContent = order.length;
  const pct = score / order.length;
  document.getElementById('scoreText').textContent =
    pct === 1 ? '¡Ya eres todo un guardián del reglamento!' :
    pct >= 0.6 ? '¡Muy bien! Ya casi dominas el reglamento del arrecife.' :
    'Buen intento — repasa con tu grupo el Reglamento del Arrecife y vuelve a intentarlo.';
}

function restart() {
  current = 0; score = 0;
  order = shuffle(items);
  buildProgress();
  document.getElementById('game').style.display = 'block';
  document.getElementById('endScreen').style.display = 'none';
  showCard();
}

restart();
</script>
</body>
</html>
