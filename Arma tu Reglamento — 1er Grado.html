<!DOCTYPE html>
<!-- saved from url=(0066)file:///C:/Users/dylan/Downloads/Arma_tu_Reglamento_1er_Grado.html -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arma tu Reglamento — 1er Grado</title>
<style>
  :root {
    --teal: #0096BC; --teal-dark: #006583; --navy: #1B3A5C;
    --gold: #FFB300; --coral: #FF6F61; --green: #4CBB6F; --purple: #9575CD;
    --cream: #FFFAEB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(180deg, var(--teal) 0%, var(--teal-dark) 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 20px; color: var(--navy); position: relative;
  }
  .bunting { display: flex; width: 100%; max-width: 700px; height: 24px; margin-bottom: 10px; }
  .bunting div { flex: 1; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 24px solid; }
  h1 { color: white; font-size: 1.8rem; margin: 10px 0 4px; text-align: center; }
  .sub { color: #FFE7B0; margin-bottom: 16px; font-weight: 600; }
  .card {
    background: white; border-radius: 24px; padding: 24px; max-width: 700px; width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  .situation-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .situation {
    background: var(--navy); color: white; border-radius: 16px; padding: 18px; flex: 1;
    font-size: 1.15rem; text-align: center; min-height: 60px;
    display: flex; align-items: center; justify-content: center;
  }
  .speak-btn { background: var(--gold); color: var(--navy); border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 1.3rem; cursor: pointer; box-shadow: 0 4px 0 #b57900; flex-shrink: 0; }
  .options { display: grid; gap: 14px; }
  .opt {
    border: 4px solid var(--teal); border-radius: 16px; padding: 16px;
    font-size: 1.1rem; background: var(--cream); cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 12px; transition: transform 0.15s;
  }
  .opt:active { transform: scale(0.97); }
  .opt .emoji { font-size: 2rem; }
  .opt.correct { background: #DFF5E5; border-color: var(--green); }
  .opt.wrong { background: #FFE3E0; border-color: var(--coral); }
  .feedback { text-align: center; font-size: 1.3rem; font-weight: 700; margin-top: 16px; min-height: 40px; }
  .next-btn {
    display: block; margin: 16px auto 0; background: var(--gold); color: white; border: none;
    border-radius: 30px; padding: 14px 32px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
  }
  .progress { color: white; margin-top: 14px; font-weight: 600; }
  .stars { font-size: 2.5rem; text-align: center; margin: 20px 0; }
  footer { color: #D6EEF5; margin-top: 20px; font-size: 0.85rem; text-align: center; }
  .mute-btn { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 46px; height: 46px; font-size: 1.3em; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,60,80,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-box { background: white; color: var(--navy); border-radius: 24px; padding: 28px; max-width: 380px; text-align: center; }
  .modal-box button { margin-top: 14px; padding: 14px 28px; background: var(--green); color: white; border: none; border-radius: 999px; font-size: 1.05em; font-weight: 700; cursor: pointer; box-shadow: 0 5px 0 #327d49; }
  .hidden { display: none; }
</style>
</head>
<body>
  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
  <div class="modal-overlay" id="introModal">
    <div class="modal-box">
      <div style="font-size:2.6em">🦁</div>
      <h2>Cómo se juega</h2>
      <p>Te van a leer una situación del salón. Elige la opción que ayuda a convivir mejor.</p>
      <button onclick="closeIntro()">¡Empezar! 🎮</button>
    </div>
  </div>
  <div class="bunting" id="bunting"><div style="border-top-color: rgb(255, 111, 97);"></div><div style="border-top-color: rgb(255, 179, 0);"></div><div style="border-top-color: rgb(76, 187, 111);"></div><div style="border-top-color: rgb(0, 150, 188);"></div><div style="border-top-color: rgb(149, 117, 205);"></div><div style="border-top-color: rgb(255, 111, 97);"></div><div style="border-top-color: rgb(255, 179, 0);"></div><div style="border-top-color: rgb(76, 187, 111);"></div><div style="border-top-color: rgb(0, 150, 188);"></div><div style="border-top-color: rgb(149, 117, 205);"></div><div style="border-top-color: rgb(255, 111, 97);"></div><div style="border-top-color: rgb(255, 179, 0);"></div><div style="border-top-color: rgb(76, 187, 111);"></div><div style="border-top-color: rgb(0, 150, 188);"></div><div style="border-top-color: rgb(149, 117, 205);"></div></div>
  <h1>🦁 Arma tu Reglamento 🦒</h1>
  <div class="sub">1er Grado · Proyecto 2</div>
  <div class="card hidden" id="mainCard">
    <div id="game"></div>
  </div>
  <div class="progress" id="progress"></div>
  <footer>EnciendeIA · Planeaciones NEM</footer>

<script>
const colors = ['#FF6F61','#FFB300','#4CBB6F','#0096BC','#9575CD'];
const b = document.getElementById('bunting');
for (let i=0;i<15;i++){ const d=document.createElement('div'); d.style.borderTopColor=colors[i%5]; b.appendChild(d); }

let muted = false;
function vibrate(pattern){ if(!muted && navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} } }
function speak(text){
  if(muted || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[😢📦🚪🎨🙋]/g,''));
  u.lang='es-MX'; u.rate=0.9;
  window.speechSynthesis.speak(u);
}
function toggleMute(){
  muted=!muted;
  document.getElementById('muteBtn').textContent = muted?'🔇':'🔊';
  if(muted && 'speechSynthesis' in window) window.speechSynthesis.cancel();
}
function confettiBurst(){
  const cs=['#FFB300','#FF6F61','#4CBB6F','#9575CD','#ffffff'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div');
    const size=6+Math.random()*8;
    el.style.cssText=`position:fixed;top:-20px;left:${Math.random()*100}vw;width:${size}px;height:${size}px;background:${cs[Math.floor(Math.random()*cs.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};z-index:9999;pointer-events:none;`;
    document.body.appendChild(el);
    const duration=2200+Math.random()*1500;
    const rotate=(Math.random()>0.5?1:-1)*(Math.random()*360+180);
    const drift=(Math.random()-0.5)*200;
    el.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${drift}px, 100vh) rotate(${rotate}deg)`,opacity:0.4}],{duration,easing:'ease-in'});
    setTimeout(()=>el.remove(), duration);
  }
}
function closeIntro(){
  document.getElementById('introModal').style.display='none';
  document.getElementById('mainCard').classList.remove('hidden');
  render();
}

const situations = [
  { text: "😢 Alguien no espera su turno para hablar y todos gritan a la vez.", options: [
    { emoji: "👂", text: "Hablamos uno a la vez y esperamos turno", correct: true },
    { emoji: "🏃", text: "Corremos dentro del salón", correct: false },
    { emoji: "🤫", text: "Nadie puede hablar nunca", correct: false },
  ]},
  { text: "📦 Alguien deja los materiales tirados después de usarlos.", options: [
    { emoji: "🗑️", text: "Los tiramos a la basura", correct: false },
    { emoji: "🧹", text: "Cuidamos y guardamos el material", correct: true },
    { emoji: "😴", text: "Los dejamos ahí", correct: false },
  ]},
  { text: "🚪 El grupo va a salir del salón en fila.", options: [
    { emoji: "🏃‍♂️", text: "Cada quien corre por su lado", correct: false },
    { emoji: "🚶‍♀️", text: "Caminamos en fila con calma", correct: true },
    { emoji: "🤼", text: "Nos empujamos para salir primero", correct: false },
  ]},
  { text: "🎨 Dos compañeros quieren el mismo color de crayola.", options: [
    { emoji: "😠", text: "Se lo quitamos a la fuerza", correct: false },
    { emoji: "🤝", text: "Platicamos y nos turnamos", correct: true },
    { emoji: "😢", text: "Nos vamos a llorar solos", correct: false },
  ]},
  { text: "🙋 La maestra hace una pregunta al grupo.", options: [
    { emoji: "🖐️", text: "Levantamos la mano para hablar", correct: true },
    { emoji: "📢", text: "Todos gritamos la respuesta juntos", correct: false },
    { emoji: "🙈", text: "Nadie responde nunca", correct: false },
  ]},
];

let idx = 0, score = 0, answered = false;

function shuffle(arr) { return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function render() {
  answered = false;
  const s = situations[idx];
  const opts = shuffle(s.options);
  const game = document.getElementById('game');
  game.innerHTML = `
    <div class="situation-row">
      <div class="situation">${s.text}</div>
      <button class="speak-btn" onclick="speak(situations[idx].text)">🔊</button>
    </div>
    <div class="options">
      ${opts.map((o,i) => `<div class="opt" data-correct="${o.correct}" onclick="pick(this)"><span class="emoji">${o.emoji}</span><span>${o.text}</span></div>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
  `;
  document.getElementById('progress').textContent = `Situación ${idx+1} de ${situations.length} · ⭐ ${score}`;
  speak(s.text);
}

function pick(el) {
  if (answered) return;
  answered = true;
  const correct = el.dataset.correct === "true";
  document.querySelectorAll('.opt').forEach(o => {
    if (o.dataset.correct === "true") o.classList.add('correct');
  });
  if (!correct) { el.classList.add('wrong'); vibrate([30,60,30]); }
  else { score++; vibrate(40); }
  document.getElementById('feedback').textContent = correct ? "¡Muy bien! 🎉" : "Casi — mira la opción verde 💚";
  setTimeout(() => {
    idx++;
    if (idx < situations.length) render();
    else finish();
  }, 1400);
}

function finish() {
  const game = document.getElementById('game');
  const pct = Math.round(score/situations.length*100);
  game.innerHTML = `
    <div class="stars">${'⭐'.repeat(Math.max(1,Math.round(score/situations.length*5)))}</div>
    <div class="feedback">¡Terminaste! Acertaste ${score} de ${situations.length}</div>
    <button class="next-btn" onclick="idx=0;score=0;render();">Jugar de nuevo</button>
  `;
  document.getElementById('progress').textContent = '';
  if (pct >= 60) confettiBurst();
}
</script>


</body></html>
