<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>El Detective del Agua — EnciendeIA</title>
<style>
  body { font-family: Arial, sans-serif; background: linear-gradient(180deg,#e6f7fb,#c7ecf5); color: #1a1a1a; margin:0; padding:20px; text-align:center; }
  h1 { color: #00738a; }
  .scene { background: #ffffff; border: 3px solid #00B4D8; border-radius: 16px; padding: 20px; max-width: 480px; margin: 20px auto; }
  .escena-emoji { font-size: 90px; line-height: 1; }
  .desc { font-size: 18px; margin-top: 10px; }
  button.opt { display:block; width:80%; margin:10px auto; padding:14px; font-size:18px; border:none; border-radius:10px; background:#00B4D8; color:white; cursor:pointer; }
  button.opt:hover { background:#0093b0; }
  button.opt:disabled { opacity: 0.6; cursor: default; }
  #feedback { font-size:20px; min-height:50px; margin-top:10px; font-weight:bold; max-width:480px; margin-left:auto; margin-right:auto; }
  #score { font-size:16px; color:#F4A100; font-weight:bold; }
  #next { padding:10px 20px; font-size:16px; background:#F4A100; border:none; border-radius:8px; cursor:pointer; display:none; color:white; }
  #final { display:none; background:#ffffff; border: 3px solid #00B4D8; border-radius:16px; padding:30px; max-width:480px; margin:20px auto; }
  #final h2 { color:#00738a; margin-top:0; }
  #final p { font-size:16px; line-height:1.5; }
  #playAgain { padding:12px 24px; font-size:16px; background:#00B4D8; color:white; border:none; border-radius:10px; cursor:pointer; margin-top:10px; }
  #playAgain:hover { background:#0093b0; }
</style>
</head>
<body>
<h1>💧 El Detective del Agua</h1>
<p>Mira la escena. ¿Qué acción tomarías como buen Guardián del Agua?</p>
<div class="scene" id="scene"></div>
<div id="options"></div>
<div id="feedback"></div>
<div id="score">Aciertos: 0 / 0</div>
<button id="next" onclick="nextRound()">Siguiente →</button>

<div id="final">
  <h2>🏆 ¡Turno completado!</h2>
  <p id="finalScore"></p>
  <p>Ya lo sabes: cierra bien las llaves, avisa si ves una fuga, y felicita a quien cuida bien el agua.</p>
  <button id="playAgain" onclick="restart()">Jugar de nuevo</button>
</div>

<script>
const rounds = [
  { emoji: "🚰💧", desc: "Ves una llave del baño goteando lentamente, gota a gota, aunque nadie la está usando.",
    correct: "Avisar a un adulto",
    explain: "¡Correcto! Una llave que gotea es una fuga — hay que avisar a un adulto para que la repare, no ignorarla ni intentar arreglarla tú solo." },
  { emoji: "🧴🚿", desc: "Un compañero se está lavando las manos y cierra bien la llave en cuanto termina de enjabonarse.",
    correct: "Felicitar el buen uso",
    explain: "¡Correcto! Cerrar la llave mientras te enjabonas y solo abrirla para enjuagar es un uso responsable del agua — vale la pena reconocerlo." },
  { emoji: "🚽💦", desc: "Ves que el bebedero del patio dejó correr agua toda la mañana porque el botón se quedó atorado.",
    correct: "Avisar a un adulto",
    explain: "¡Correcto! Un bebedero que no deja de correr es un desperdicio grande — hay que avisar de inmediato a dirección o intendencia." },
  { emoji: "🌱🚿", desc: "El jardinero de la escuela riega las plantas muy temprano en la mañana, cuando todavía no hace calor.",
    correct: "Felicitar el buen uso",
    explain: "¡Correcto! Regar temprano, antes de que salga el sol fuerte, evita que el agua se evapore rápido — es un uso responsable." },
  { emoji: "🚰❌", desc: "Alguien deja la llave del lavamanos abierta mientras platica con un amigo, sin estar usando el agua.",
    correct: "Avisar a un adulto",
    explain: "¡Correcto! Dejar correr el agua sin usarla es un desperdicio — puedes recordarle a tu compañero que la cierre, y si no reacciona, avisar a un adulto." },
  { emoji: "🪣✅", desc: "Un equipo de tu salón terminó su recorrido de inspección y no encontró ninguna fuga ni desperdicio ese día.",
    correct: "Felicitar el buen uso",
    explain: "¡Correcto! Cuando todo está en orden, también vale la pena reconocerlo — significa que la escuela está cuidando bien el agua." }
];

let order = [...rounds].sort(() => Math.random() - 0.5);
let idx = 0, correct = 0, total = 0;
const options = ["Avisar a un adulto", "Felicitar el buen uso"];

function render() {
  const r = order[idx];
  document.getElementById("next").textContent = (idx === order.length - 1) ? "Ver resultado →" : "Siguiente →";
  document.getElementById("scene").innerHTML = `<div class="escena-emoji">${r.emoji}</div><div class="desc">${r.desc}</div>`;
  const opts = document.getElementById("options");
  opts.innerHTML = "";
  options.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o;
    b.onclick = () => check(o, r);
    opts.appendChild(b);
  });
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").style.display = "none";
}

function check(choice, r) {
  total++;
  const fb = document.getElementById("feedback");
  if (choice === r.correct) {
    correct++;
    fb.style.color = "#16a34a";
    fb.textContent = r.explain;
  } else {
    fb.style.color = "#dc2626";
    fb.textContent = "No exactamente. " + r.explain;
  }
  document.getElementById("score").textContent = `Aciertos: ${correct} / ${total}`;
  document.querySelectorAll("button.opt").forEach(b => b.disabled = true);
  document.getElementById("next").style.display = "inline-block";
}

function nextRound() {
  if (idx < order.length - 1) {
    idx++;
    render();
  } else {
    showFinal();
  }
}

function showFinal() {
  document.querySelector(".scene").style.display = "none";
  document.getElementById("options").style.display = "none";
  document.getElementById("feedback").style.display = "none";
  document.getElementById("score").style.display = "none";
  document.getElementById("next").style.display = "none";
  document.getElementById("finalScore").textContent = `Respondiste correctamente ${correct} de ${total} rondas.`;
  document.getElementById("final").style.display = "block";
}

function restart() {
  order = [...rounds].sort(() => Math.random() - 0.5);
  idx = 0; correct = 0; total = 0;
  document.getElementById("final").style.display = "none";
  document.querySelector(".scene").style.display = "block";
  document.getElementById("options").style.display = "block";
  document.getElementById("feedback").style.display = "block";
  document.getElementById("score").style.display = "block";
  document.getElementById("score").textContent = "Aciertos: 0 / 0";
  render();
}

render();
</script>
</body>
</html>
