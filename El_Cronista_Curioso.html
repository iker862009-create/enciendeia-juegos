<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>El Cronista Curioso — EnciendeIA</title>
<style>
  body { font-family: Arial, sans-serif; background: linear-gradient(180deg,#fff6e6,#ffe9c2); color: #1a1a1a; margin:0; padding:20px; text-align:center; }
  h1 { color: #a15c00; }
  .scene { background: #ffffff; border: 3px solid #F4A100; border-radius: 16px; padding: 20px; max-width: 520px; margin: 20px auto; }
  .escena-emoji { font-size: 70px; line-height: 1; }
  .desc { font-size: 17px; margin-top: 10px; text-align: left; }
  button.opt { display:block; width:90%; margin:10px auto; padding:14px; font-size:16px; border:none; border-radius:10px; background:#00B4D8; color:white; cursor:pointer; text-align:left; padding-left: 20px; }
  button.opt:hover { background:#0093b0; }
  button.opt:disabled { opacity: 0.6; cursor: default; }
  #feedback { font-size:17px; min-height:50px; margin-top:10px; font-weight:bold; max-width:520px; margin-left:auto; margin-right:auto; text-align:left; }
  #score { font-size:16px; color:#F4A100; font-weight:bold; }
  #next { padding:10px 20px; font-size:16px; background:#F4A100; border:none; border-radius:8px; cursor:pointer; display:none; color:white; }
  #final { display:none; background:#ffffff; border: 3px solid #F4A100; border-radius:16px; padding:30px; max-width:520px; margin:20px auto; }
  #final h2 { color:#a15c00; margin-top:0; }
  #final p { font-size:16px; line-height:1.5; }
  #playAgain { padding:12px 24px; font-size:16px; background:#00B4D8; color:white; border:none; border-radius:10px; cursor:pointer; margin-top:10px; }
  #playAgain:hover { background:#0093b0; }
</style>
</head>
<body>
<h1>🔦 El Cronista Curioso</h1>
<p>Lee la escena. ¿Cuál es la mejor forma de actuar como buen Cronista de la Comunidad?</p>
<div class="scene" id="scene"></div>
<div id="options"></div>
<div id="feedback"></div>
<div id="score">Aciertos: 0 / 0</div>
<button id="next" onclick="nextRound()">Siguiente →</button>

<div id="final">
  <h2>🏆 ¡Turno completado!</h2>
  <p id="finalScore"></p>
  <p>Ya lo sabes: pregunta con preguntas abiertas, escucha sin interrumpir, y anota con fidelidad lo que la persona dijo.</p>
  <button id="playAgain" onclick="restart()">Jugar de nuevo</button>
</div>

<script>
const rounds = [
  { emoji: "🗣️", desc: "Le preguntas a tu entrevistado: \"¿Le gustó su trabajo?\" y responde solo \"Sí\", sin dar más detalles.",
    options: ["Cambiar la pregunta por una abierta, como '¿Qué fue lo que más le gustó de su trabajo?'", "Anotar 'Sí' y pasar a la siguiente pregunta"],
    correct: "Cambiar la pregunta por una abierta, como '¿Qué fue lo que más le gustó de su trabajo?'",
    explain: "¡Correcto! Una pregunta cerrada como '¿le gustó?' casi siempre da respuestas cortas — reformularla como pregunta abierta invita a la persona a contar más." },
  { emoji: "😮", desc: "Tu entrevistado empieza a contar una historia larga y emocionante, y tú tienes ganas de interrumpir para hacer otra pregunta.",
    options: ["Esperar a que termine su idea antes de preguntar algo más", "Interrumpir para no olvidar tu siguiente pregunta"],
    correct: "Esperar a que termine su idea antes de preguntar algo más",
    explain: "¡Correcto! Interrumpir corta el hilo de la historia — es mejor anotar tu idea para después y dejar que la persona termine." },
  { emoji: "✍️", desc: "Tu entrevistado dijo una frase muy bonita, pero tú no recuerdas las palabras exactas al escribir tu página del Álbum.",
    options: ["Inventar una frase parecida que 'suene bien'", "Escribir solo lo que sí recuerdas con seguridad, o revisar tu grabación si tienes una"],
    correct: "Escribir solo lo que sí recuerdas con seguridad, o revisar tu grabación si tienes una",
    explain: "¡Correcto! Inventar palabras que la persona no dijo rompe la fidelidad del testimonio — es mejor quedarte con lo que sí verificaste." },
  { emoji: "🎙️", desc: "Quieres grabar la entrevista en tu celular para no olvidar nada.",
    options: ["Grabar sin avisar, para que la persona hable 'natural'", "Pedir permiso antes de grabar y explicar para qué es"],
    correct: "Pedir permiso antes de grabar y explicar para qué es",
    explain: "¡Correcto! Grabar a alguien sin su permiso no es respetuoso — siempre hay que pedir permiso antes." },
  { emoji: "📖", desc: "Al escribir tu página del Álbum, no estás segura de si una parte de la historia que te contaron es exactamente así o si la estás exagerando un poco para que suene más interesante.",
    options: ["Exagerar un poco, total 'nadie se va a dar cuenta'", "Contar la historia tal como te la dijeron, sin exagerar"],
    correct: "Contar la historia tal como te la dijeron, sin exagerar",
    explain: "¡Correcto! Un buen Cronista cuida la fidelidad del testimonio, incluso si la versión exagerada suena más emocionante." },
  { emoji: "🙏", desc: "Terminaste tu entrevista y tu entrevistado te dedicó su tiempo con mucha amabilidad.",
    options: ["Agradecerle su tiempo antes de irte", "Irte directo a escribir tu página, sin decir nada más"],
    correct: "Agradecerle su tiempo antes de irte",
    explain: "¡Correcto! Agradecer es parte de tratar con respeto a la persona que compartió su historia contigo." }
];

let order = [...rounds].sort(() => Math.random() - 0.5);
let idx = 0, correct = 0, total = 0;

function render() {
  const r = order[idx];
  document.getElementById("next").textContent = (idx === order.length - 1) ? "Ver resultado →" : "Siguiente →";
  document.getElementById("scene").innerHTML = `<div class="escena-emoji">${r.emoji}</div><div class="desc">${r.desc}</div>`;
  const opts = document.getElementById("options");
  opts.innerHTML = "";
  r.options.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o;
    b.onclick = () => check(o, r);
    opts.appendChild(b);
  });
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").style.display = "none";
}

function check(choice, r) {
  total++;
  const fb = document.getElementById("feedback");
  if (choice === r.correct) {
    correct++;
    fb.style.color = "#16a34a";
    fb.textContent = r.explain;
  } else {
    fb.style.color = "#dc2626";
    fb.textContent = "No exactamente. " + r.explain;
  }
  document.getElementById("score").textContent = `Aciertos: ${correct} / ${total}`;
  document.querySelectorAll("button.opt").forEach(b => b.disabled = true);
  document.getElementById("next").style.display = "inline-block";
}

function nextRound() {
  if (idx < order.length - 1) {
    idx++;
    render();
  } else {
    showFinal();
  }
}

function showFinal() {
  document.querySelector(".scene").style.display = "none";
  document.getElementById("options").style.display = "none";
  document.getElementById("feedback").style.display = "none";
  document.getElementById("score").style.display = "none";
  document.getElementById("next").style.display = "none";
  document.getElementById("finalScore").textContent = `Respondiste correctamente ${correct} de ${total} rondas.`;
  document.getElementById("final").style.display = "block";
}

function restart() {
  order = [...rounds].sort(() => Math.random() - 0.5);
  idx = 0; correct = 0; total = 0;
  document.getElementById("final").style.display = "none";
  document.querySelector(".scene").style.display = "block";
  document.getElementById("options").style.display = "block";
  document.getElementById("feedback").style.display = "block";
  document.getElementById("score").style.display = "block";
  document.getElementById("score").textContent = "Aciertos: 0 / 0";
  render();
}

render();
</script>
</body>
</html>
