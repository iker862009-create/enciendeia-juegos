<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embajadores de la Paz</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(180deg, #8fe3f0 0%, #2a9fc0 55%, #0d5c73 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 20px; color: #fff;
  }
  h1 { text-align: center; font-size: 1.5em; text-shadow: 2px 2px 0 #0d5c73; margin: 6px 0; }
  .sub { text-align: center; opacity: 0.95; margin-bottom: 16px; max-width: 480px; }
  .steps-pool, .steps-answer {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 480px; margin-bottom: 16px;
  }
  .step-chip {
    background: white; color: #0d5c73; padding: 14px 18px; border-radius: 16px; font-weight: bold;
    cursor: pointer; box-shadow: 0 5px 0 #b8dfe8; font-size: 1em; user-select: none;
  }
  .step-chip.used { opacity: 0.3; pointer-events: none; }
  .slot {
    min-width: 90px; min-height: 50px; border: 3px dashed rgba(255,255,255,0.6); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; padding: 8px 12px; font-weight: bold;
  }
  .slot.filled { border-style: solid; background: #FFB300; color: #0d5c73; }
  .feedback { min-height: 30px; font-size: 1.2em; margin: 10px 0; text-align: center; }
  .check-btn, .restart, .next-btn {
    margin-top: 10px; padding: 14px 28px; background: #4CBB6F; color: white;
    border: none; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer;
    box-shadow: 0 6px 0 #327d49;
  }
  .card {
    background: white; color: #0d5c73; border-radius: 20px; padding: 22px; max-width: 460px;
    width: 100%; font-size: 1.15em; text-align: center; box-shadow: 0 6px 0 #0a4a5c; margin-bottom: 14px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 460px; }
  .opt-btn {
    padding: 14px; border-radius: 14px; border: none; background: #e8f7fb; color: #0d5c73;
    font-size: 1em; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #b8dfe8;
  }
  .hidden { display: none; }
  .end-screen { text-align: center; }
</style>
</head>
<body>
<h1>🐬 Embajadores de la Paz</h1>

<div id="phase1">
  <p class="sub">Delfi olvidó el orden de los 4 pasos para hacer las paces. Tócalos en el orden correcto:</p>
  <div class="steps-answer" id="answerSlots"></div>
  <div class="steps-pool" id="pool"></div>
  <div class="feedback" id="fb1"></div>
</div>

<div id="phase2" class="hidden">
  <p class="sub">Ahora aplica lo que aprendiste. Lee la situación y elige qué paso corresponde:</p>
  <div class="card" id="scenarioText"></div>
  <div class="options" id="scenarioOptions"></div>
  <div class="feedback" id="fb2"></div>
</div>

<div id="endScreen" class="end-screen hidden">
  <div style="font-size:3.5em">🐬🏅</div>
  <h2>¡Ya eres Embajador de la Paz!</h2>
  <p id="scoreText"></p>
  <button class="restart" onclick="location.reload()">Jugar de nuevo</button>
</div>

<script>
const correctOrder = [
  "Contar cómo me siento",
  "Escuchar al otro",
  "Proponer una solución",
  "Elegir juntos"
];

let pool = [...correctOrder].sort(() => Math.random() - 0.5);
let placed = [];
let score2 = 0;

const poolDiv = document.getElementById('pool');
const slotsDiv = document.getElementById('answerSlots');

function renderPool() {
  poolDiv.innerHTML = '';
  pool.forEach((step, i) => {
    const chip = document.createElement('div');
    chip.className = 'step-chip';
    chip.textContent = step;
    chip.onclick = () => placeStep(step, chip);
    poolDiv.appendChild(chip);
  });
}

function renderSlots() {
  slotsDiv.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('div');
    s.className = 'slot' + (placed[i] ? ' filled' : '');
    s.textContent = placed[i] ? (i+1) + '. ' + placed[i] : (i+1);
    slotsDiv.appendChild(s);
  }
}

function placeStep(step, chipEl) {
  if (placed.length >= 4) return;
  placed.push(step);
  chipEl.classList.add('used');
  renderSlots();
  if (placed.length === 4) checkOrder();
}

function checkOrder() {
  const fb = document.getElementById('fb1');
  const isCorrect = placed.every((s, i) => s === correctOrder[i]);
  if (isCorrect) {
    fb.textContent = '¡Perfecto! Ese es el orden correcto 🎉';
    fb.style.color = '#FFB300';
    setTimeout(startPhase2, 1400);
  } else {
    fb.textContent = 'Ese orden no es el correcto, inténtalo de nuevo 🤔';
    fb.style.color = '#ffdada';
    setTimeout(() => {
      placed = [];
      pool = [...correctOrder].sort(() => Math.random() - 0.5);
      renderPool();
      renderSlots();
      fb.textContent = '';
    }, 1500);
  }
}

renderPool();
renderSlots();

// Fase 2: escenarios aplicados
const scenarios = [
  {
    text: "Dos compañeros quieren el mismo color de crayón y empiezan a jalarlo. ¿Cuál es el PRIMER paso que deben dar?",
    options: ["Elegir juntos una solución", "Contar cómo se sienten", "Proponer una solución"],
    correct: 1
  },
  {
    text: "Ya cada quien contó cómo se siente por el conflicto. ¿Qué sigue?",
    options: ["Escuchar al otro con atención", "Ir con el maestro a acusar", "Ignorar al otro"],
    correct: 0
  },
  {
    text: "Ya se escucharon los dos. ¿Qué deben hacer ahora?",
    options: ["Volver a pelear", "Proponer una solución entre los dos", "Quedarse callados"],
    correct: 1
  },
  {
    text: "Ya tienen varias ideas de solución. ¿Cómo terminan de hacer las paces?",
    options: ["Cada quien hace lo que quiere", "Eligen juntos la solución que les sirve a los dos", "Uno decide por los dos"],
    correct: 1
  },
];
let sIndex = 0;

function startPhase2() {
  document.getElementById('phase1').classList.add('hidden');
  document.getElementById('phase2').classList.remove('hidden');
  showScenario();
}

function showScenario() {
  if (sIndex >= scenarios.length) return endGame();
  const s = scenarios[sIndex];
  document.getElementById('scenarioText').textContent = s.text;
  const optDiv = document.getElementById('scenarioOptions');
  optDiv.innerHTML = '';
  document.getElementById('fb2').textContent = '';
  s.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => answerScenario(i);
    optDiv.appendChild(btn);
  });
}

function answerScenario(i) {
  const s = scenarios[sIndex];
  const fb = document.getElementById('fb2');
  if (i === s.correct) {
    score2++;
    fb.textContent = '¡Correcto! 🎉';
    fb.style.color = '#FFB300';
  } else {
    fb.textContent = 'No es ese, pero sigue intentando 🤔';
    fb.style.color = '#ffdada';
  }
  sIndex++;
  setTimeout(showScenario, 1100);
}

function endGame() {
  document.getElementById('phase2').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
  const pct = score2 / scenarios.length;
  document.getElementById('scoreText').textContent =
    'Acertaste ' + score2 + ' de ' + scenarios.length + ' situaciones. ' +
    (pct === 1 ? '¡Dominas los 4 pasos!' : pct >= 0.5 ? '¡Muy bien! Sigue practicando.' : 'Repásalos con tu grupo y vuelve a intentar.');
}
</script>
</body>
</html>
