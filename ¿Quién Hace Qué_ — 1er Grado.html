<!DOCTYPE html>
<!-- saved from url=(0062)file:///C:/Users/dylan/Downloads/Quien_Hace_Que_1er_Grado.html -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quién Hace Qué? — 1er Grado</title>
<style>
  :root { --teal:#0096BC; --teal-dark:#006583; --navy:#1B3A5C; --gold:#FFB300; --coral:#FF6F61; --green:#4CBB6F; --purple:#9575CD; --cream:#FFFAEB; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(180deg,var(--teal) 0%,var(--teal-dark) 100%); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; position:relative; }
  .bunting { display:flex; width:100%; max-width:560px; height:24px; margin-bottom:10px; }
  .bunting div { flex:1; height:0; border-left:16px solid transparent; border-right:16px solid transparent; border-top:24px solid; }
  h1 { color:white; font-size:1.6rem; margin:8px 0 2px; text-align:center; }
  .sub { color:#FFE7B0; margin-bottom:14px; font-weight:600; }
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:520px; width:100%; }
  .tile { aspect-ratio:1; background:white; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:2.2rem; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.2); user-select:none; }
  .tile.hidden-face { background:var(--navy); color:var(--gold); font-size:1.8rem; }
  .tile.matched { background:#DFF5E5; box-shadow:none; opacity:0.7; cursor:default; }
  .progress { color:white; margin-top:16px; font-weight:600; }
  .stars { font-size:2.5rem; text-align:center; margin:16px 0; }
  .next-btn { display:block; margin:16px auto 0; background:var(--gold); color:white; border:none; border-radius:30px; padding:14px 32px; font-size:1.1rem; font-weight:700; cursor:pointer; }
  footer { color:#D6EEF5; margin-top:20px; font-size:0.85rem; text-align:center; }
  .mute-btn { position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.9); border:none; border-radius:50%; width:46px; height:46px; font-size:1.3em; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.2); }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,60,80,0.9); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-box { background:white; color:var(--navy); border-radius:24px; padding:28px; max-width:380px; text-align:center; }
  .modal-box button { margin-top:14px; padding:14px 28px; background:var(--green); color:white; border:none; border-radius:999px; font-size:1.05em; font-weight:700; cursor:pointer; box-shadow:0 5px 0 #327d49; }
  .hidden { display:none; }
</style>
</head>
<body>
  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
  <div class="modal-overlay" id="introModal">
    <div class="modal-box">
      <div style="font-size:2.6em">🐘</div>
      <h2>Cómo se juega</h2>
      <p>Voltea dos tarjetas. Encuentra qué oficio va con qué resultado de su trabajo.</p>
      <button onclick="closeIntro()">¡Empezar! 🎮</button>
    </div>
  </div>
  <div class="bunting" id="bunting"><div style="border-top-color: rgb(255, 111, 97);"></div><div style="border-top-color: rgb(255, 179, 0);"></div><div style="border-top-color: rgb(76, 187, 111);"></div><div style="border-top-color: rgb(0, 150, 188);"></div><div style="border-top-color: rgb(149, 117, 205);"></div><div style="border-top-color: rgb(255, 111, 97);"></div><div style="border-top-color: rgb(255, 179, 0);"></div><div style="border-top-color: rgb(76, 187, 111);"></div><div style="border-top-color: rgb(0, 150, 188);"></div><div style="border-top-color: rgb(149, 117, 205);"></div><div style="border-top-color: rgb(255, 111, 97);"></div><div style="border-top-color: rgb(255, 179, 0);"></div></div>
  <h1>🐘 ¿Quién Hace Qué? 🐒</h1>
  <div class="sub">1er Grado · Proyecto 6 · Memorama de Oficios</div>
  <div class="board hidden" id="board"><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div><div class="tile hidden-face">❓</div></div>
  <div class="progress hidden" id="progress">Encuentra los 6 pares</div>
  <div id="finishArea"></div>
  <footer>EnciendeIA · Planeaciones NEM</footer>

<script>
const colors = ['#FF6F61','#FFB300','#4CBB6F','#0096BC','#9575CD'];
const b = document.getElementById('bunting');
for (let i=0;i<12;i++){ const d=document.createElement('div'); d.style.borderTopColor=colors[i%5]; b.appendChild(d); }

let muted = false;
function vibrate(pattern){ if(!muted && navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} } }
function toggleMute(){ muted=!muted; document.getElementById('muteBtn').textContent = muted?'🔇':'🔊'; }
function confettiBurst(){
  const cs=['#FFB300','#FF6F61','#4CBB6F','#9575CD','#ffffff'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div');
    const size=6+Math.random()*8;
    el.style.cssText=`position:fixed;top:-20px;left:${Math.random()*100}vw;width:${size}px;height:${size}px;background:${cs[Math.floor(Math.random()*cs.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};z-index:9999;pointer-events:none;`;
    document.body.appendChild(el);
    const duration=2200+Math.random()*1500;
    const rotate=(Math.random()>0.5?1:-1)*(Math.random()*360+180);
    const drift=(Math.random()-0.5)*200;
    el.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${drift}px, 100vh) rotate(${rotate}deg)`,opacity:0.4}],{duration,easing:'ease-in'});
    setTimeout(()=>el.remove(), duration);
  }
}
function closeIntro(){
  document.getElementById('introModal').style.display='none';
  document.getElementById('board').classList.remove('hidden');
  document.getElementById('progress').classList.remove('hidden');
  render();
}

const pairs = [
  ['👩‍🍳','🍞'],
  ['🔨','🪑'],
  ['🧵','👗'],
  ['🌾','🌽'],
  ['🐄','🥛'],
  ['🧱','🏠'],
];

let cards = [];
pairs.forEach((p,i) => { cards.push({id:i,emoji:p[0]}); cards.push({id:i,emoji:p[1]}); });
cards = cards.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);

let flipped = [], matched = 0, lock = false;

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  cards.forEach((c, idx) => {
    const t = document.createElement('div');
    t.className = 'tile hidden-face';
    t.textContent = '❓';
    t.onclick = () => flip(idx);
    board.appendChild(t);
  });
}

function flip(idx) {
  if (lock) return;
  const tiles = document.querySelectorAll('.tile');
  const tile = tiles[idx];
  if (tile.classList.contains('matched') || flipped.includes(idx)) return;
  tile.classList.remove('hidden-face');
  tile.textContent = cards[idx].emoji;
  flipped.push(idx);
  if (flipped.length === 2) {
    lock = true;
    const [a,bb] = flipped;
    if (cards[a].id === cards[bb].id) {
      setTimeout(() => {
        tiles[a].classList.add('matched'); tiles[bb].classList.add('matched');
        matched++; vibrate(40); flipped = []; lock = false;
        document.getElementById('progress').textContent = `Pares encontrados: ${matched} de ${pairs.length}`;
        if (matched === pairs.length) finish();
      }, 500);
    } else {
      vibrate([30,60,30]);
      setTimeout(() => {
        tiles[a].classList.add('hidden-face'); tiles[a].textContent='❓';
        tiles[bb].classList.add('hidden-face'); tiles[bb].textContent='❓';
        flipped = []; lock = false;
      }, 900);
    }
  }
}

function finish() {
  document.getElementById('finishArea').innerHTML = `
    <div class="stars">⭐⭐⭐⭐⭐</div>
    <div style="color:white;text-align:center;font-size:1.2rem;font-weight:700;">¡Encontraste todos los oficios! 🎉</div>
    <button class="next-btn" onclick="location.reload()">Jugar de nuevo</button>
  `;
  confettiBurst();
}

render();
</script>


</body></html>
